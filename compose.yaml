# Environnement de développement complet : `docker compose up --build -d`.
# Les ports hôte et les identifiants viennent de .env (voir .env.example).

name: interview-rag-trainer

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  EXTERNAL_TIMEOUT_SECONDS: ${EXTERNAL_TIMEOUT_SECONDS:-2.0}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-interview_rag_trainer}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview_rag_trainer}
  POSTGRES_DB: ${POSTGRES_DB:-interview_rag_trainer}
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  QDRANT_GRPC_PORT: "6334"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:-interview_rag_trainer}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-interview_rag_trainer}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-rpc://}
  # Work queue de Knowledge Base (S0 §7, §8.4) : défauts Proposed.
  KB_WORK_BACKOFF_BASE_SECONDS: ${KB_WORK_BACKOFF_BASE_SECONDS:-10}
  KB_WORK_BACKOFF_MAX_SECONDS: ${KB_WORK_BACKOFF_MAX_SECONDS:-900}
  KB_WORK_LEASE_TTL_SECONDS: ${KB_WORK_LEASE_TTL_SECONDS:-300}
  KB_WORK_TIME_LIMIT_SECONDS: ${KB_WORK_TIME_LIMIT_SECONDS:-3600}
  KB_WORK_DISPATCH_INTERVAL_SECONDS: ${KB_WORK_DISPATCH_INTERVAL_SECONDS:-2}
  KB_WORK_DISPATCH_BATCH: ${KB_WORK_DISPATCH_BATCH:-50}
  KB_WORK_REDISPATCH_AFTER_SECONDS: ${KB_WORK_REDISPATCH_AFTER_SECONDS:-600}
  KB_WORK_MAX_IN_FLIGHT: ${KB_WORK_MAX_IN_FLIGHT:-2}
  KB_WORK_RECOVER_INTERVAL_SECONDS: ${KB_WORK_RECOVER_INTERVAL_SECONDS:-30}
  # Import (S2, ADR 0012). La racine des blobs n'est pas surchargeable par
  # .env : elle doit rester le point de montage du volume kb_blobs.
  KB_MAX_UPLOAD_BYTES: ${KB_MAX_UPLOAD_BYTES:-20971520}
  KB_BLOB_ROOT: /var/lib/interview-rag-trainer/blobs
  # Délai de grâce des blobs orphelins (S7), des temporaires de dépôt et de
  # la quarantaine (S8) : 24 h Proposed (ADR 0012).
  KB_BLOB_ORPHAN_GRACE_SECONDS: ${KB_BLOB_ORPHAN_GRACE_SECONDS:-86400}
  # Embeddings (S4, ADR 0008 §6). Le cache n'est pas surchargeable par .env :
  # il doit rester le point de montage du volume models_cache.
  KB_MODELS_CACHE_DIR: /var/cache/interview-rag-trainer/models
  KB_EMBEDDING_BATCH_SIZE: ${KB_EMBEDDING_BATCH_SIZE:-32}
  # Recherche (S5, knowledge-base.md §12, O12). L'API charge le modèle à la
  # première recherche (volume models_cache), jamais au démarrage.
  KB_SEARCH_OVERSAMPLING_FACTOR: ${KB_SEARCH_OVERSAMPLING_FACTOR:-2}
  KB_SEARCH_COMPLEMENT_PASSES: ${KB_SEARCH_COMPLEMENT_PASSES:-1}
  KB_MAX_PASSAGE_TOKENS: ${KB_MAX_PASSAGE_TOKENS:-1024}
  # Réconciliation (S8) : le beat (scheduler) planifie un cycle par créneau,
  # exécuté par worker_ingestion ; manifests revérifiés par cycle ; réouvertures
  # automatiques d'une purge FAILED. Clés d'idempotence purgées après 24 h
  # (O15). Borne du texte extrait d'un document, tous formats (O16).
  KB_RECONCILE_INTERVAL_SECONDS: ${KB_RECONCILE_INTERVAL_SECONDS:-300}
  KB_RECONCILE_MANIFEST_SAMPLE_SIZE: ${KB_RECONCILE_MANIFEST_SAMPLE_SIZE:-20}
  KB_RECONCILE_MAX_PURGE_REOPENINGS: ${KB_RECONCILE_MAX_PURGE_REOPENINGS:-3}
  KB_IDEMPOTENCY_KEY_TTL_SECONDS: ${KB_IDEMPOTENCY_KEY_TTL_SECONDS:-86400}
  KB_MAX_DOCUMENT_TOKENS: ${KB_MAX_DOCUMENT_TOKENS:-1000000}
  # Migration blue/green (S9) : délai avant la suppression de la collection de
  # l'index retiré par une activation (python -m runtime.index_migration).
  KB_INDEX_DROP_DELAY_SECONDS: ${KB_INDEX_DROP_DELAY_SECONDS:-300}
  # Poids de Docling PDF (S6 : layout et TableFormer, ~530 Mio) : cache du Hub
  # dans un sous-dossier du volume models_cache, téléchargés à la première
  # extraction d'un PDF par worker_ingestion. Non surchargeable par .env, comme
  # KB_MODELS_CACHE_DIR ; l'API ne convertit jamais de PDF.
  HF_HOME: /var/cache/interview-rag-trainer/models/huggingface
  # Premier téléchargement du modèle par HTTPS simple : le protocole xet du
  # Hub est resté bloqué à 0 octet dans cet environnement (2026-11-18, hôte
  # et conteneur), le téléchargement HTTP aboutit. 0 pour réactiver xet.
  HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  target: development

services:
  # Applique les migrations Alembic avant l'API : unique mécanisme de schéma.
  migrate:
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    volumes:
      # Le code et les migrations sont montés : `make migration` écrit le
      # nouveau fichier sur l'hôte et `make migrate` voit le code courant.
      - ./backend/src:/app/src:ro
      - ./backend/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  # Index initial de Knowledge Base (S4) : crée la collection Qdrant et active
  # le premier SearchIndex s'il n'existe pas ; idempotent. Avant l'API et les
  # workers : une extraction sans index actif ne créerait aucune indexation.
  kb_provision:
    build: *backend-build
    command: ["python", "-m", "runtime.provision"]
    environment: *backend-env
    volumes:
      - ./backend/src:/app/src:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    networks: [backend]

  api:
    build: *backend-build
    environment: *backend-env
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - ./backend/src:/app/src:ro
      - kb_blobs:/var/lib/interview-rag-trainer/blobs
      - models_cache:/var/cache/interview-rag-trainer/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      kb_provision:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks: [backend]

  # File par défaut : runtime.ping et les tâches dispatch / recover de
  # Knowledge Base, qui ne doivent jamais attendre derrière une extraction.
  worker:
    build: *backend-build
    command: ["celery", "-A", "runtime.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    volumes:
      - ./backend/src:/app/src:ro
      - kb_blobs:/var/lib/interview-rag-trainer/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
      kb_provision:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A runtime.worker:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks: [backend]

  # Traitements CPU de Knowledge Base (file knowledge_base.ingestion) : un seul
  # enfant, un seul message préchargé (S0 §8.1, §9). Seul service à charger
  # Docling PDF et ses modèles (S6), dans le processus enfant, à la première
  # extraction d'un PDF. L'enfant est remplacé toutes les
  # KB_INGESTION_MAX_TASKS_PER_CHILD tâches (S8) : le pic de RSS d'un même
  # processus croît sur des conversions PDF successives (ADR 0012, suivi S6 ;
  # O5) ; le nouvel enfant recharge ses modèles à leur premier usage. Les
  # cycles de réconciliation comptent dans ces tâches (12 par heure à vide :
  # un enfant remplacé toutes les ~4 h, sans rechargement tant que rien
  # n'arrive ; revue S8, M9).
  worker_ingestion:
    build: *backend-build
    command: ["celery", "-A", "runtime.worker:celery_app", "worker", "-Q", "knowledge_base.ingestion", "--loglevel=INFO", "--concurrency=1", "--prefetch-multiplier=1", "--max-tasks-per-child=${KB_INGESTION_MAX_TASKS_PER_CHILD:-50}"]
    environment: *backend-env
    volumes:
      - ./backend/src:/app/src:ro
      - kb_blobs:/var/lib/interview-rag-trainer/blobs
      - models_cache:/var/cache/interview-rag-trainer/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      kb_provision:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A runtime.worker:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks: [backend]

  # Celery beat : émet dispatch, recover et reconcile (S8), n'accède pas à la
  # base ; reconcile est exécutée par le worker de la file par défaut, qui
  # enregistre le work item du cycle.
  # Une seule instance (S0 §8.5) ; état éphémère, les planifications sont des
  # intervalles.
  scheduler:
    build: *backend-build
    command: ["celery", "-A", "runtime.worker:celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    volumes:
      - ./backend/src:/app/src:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "${FRONTEND_PORT:-5180}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      api:
        condition: service_started
    networks: [backend]

  postgres:
    # Image officielle pgvector = PostgreSQL 18 + extension vector disponible.
    # L'extension n'est pas activée : Qdrant est le moteur vectoriel principal
    # (CREATE EXTENSION se fera par migration Alembic si un besoin apparaît).
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interview_rag_trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview_rag_trainer}
      POSTGRES_DB: ${POSTGRES_DB:-interview_rag_trainer}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interview_rag_trainer} -d ${POSTGRES_DB:-interview_rag_trainer}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # L'image ne fournit ni curl ni wget : sonde TCP via bash.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-interview_rag_trainer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-interview_rag_trainer}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  # Knowledge Base : blobs des documents (S2) et cache des modèles (S4 : E5 ;
  # S6 : poids Docling sous huggingface/).
  kb_blobs:
  models_cache:

networks:
  backend:
