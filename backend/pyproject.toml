[project]
name = "interview-rag-trainer"
version = "0.1.0"
description = "Interview RAG Trainer — backend (monolithe modulaire, FastAPI, DDD)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.163",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.32",
    "alembic>=1.20,<2",
    "celery>=5.7,<6",
    "qdrant-client>=1.20,<2",
    "python-multipart>=0.0.34",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Seuls les packages Python réels sont listés : interview_training,
# assessment et shared ne contiennent encore que leur README et seront ajoutés
# ici avec leur premier vertical slice.
packages = ["src/runtime", "src/knowledge_base"]

[tool.ruff]
target-version = "py313"
src = ["src", "."]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "C4", "SIM", "ASYNC", "RUF", "T20"]

[tool.ruff.lint.isort]
# Les Bounded Contexts sont first-party même avant que leur dossier n'existe
# (les tests de S0 précèdent le code).
known-first-party = ["knowledge_base", "assessment", "interview_training", "runtime", "shared"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests", "alembic"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Celery et Kombu sont partiellement typés : les modules qui les appellent
# directement tolèrent leurs appels et décorateurs non typés.
module = [
    "runtime.worker",
    "runtime.worker_factory",
    "runtime.messaging",
    "knowledge_base.adapters.controller.dependencies",
]
disallow_untyped_calls = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Les tests d'intégration de Knowledge Base pilotent Kombu et Celery
# (files, worker in-process) : mêmes tolérances que le runtime.
module = ["tests.integration.knowledge_base.*"]
disallow_untyped_calls = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Celery n'embarque ni stubs ni marqueur py.typed.
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -m 'not integration' --import-mode=importlib"
markers = [
    "integration: nécessite les services de compose.test.yaml (PostgreSQL, Qdrant, RabbitMQ)",
]
